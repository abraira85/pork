name: semantic-release

# Computes the next semantic version from Conventional Commits on the main
# branch, pushes the matching tag, and publishes binaries + GitHub Release
# via GoReleaser — all in the same workflow run so that GITHUB_TOKEN push
# restrictions don't prevent the release from being created.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version + release
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Fetch release tag
        if: steps.tag.outputs.new_tag != steps.tag.outputs.tag
        run: git fetch --tags --force

      - name: Build & publish release
        if: steps.tag.outputs.new_tag != steps.tag.outputs.tag
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}