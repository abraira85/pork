name: semantic-release

# Computes the next semantic version from Conventional Commits on the main
# branch (patch/minor/major) and pushes the matching tag.
# Pushing the tag triggers the `release` workflow, which builds the binaries
# with GoReleaser and publishes the GitHub Release.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Bump version tag
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch