<g class="rl2"><text x="48" y="164" font-size="34" font-weight="700" fill="url(#porkgrad)">pork</text></g>
<g class="rl3"><text x="48" y="206" font-size="22" fill="#8A93B2">stop fighting lsof · ss · netstat · random kill commands</text></g>

<text x="48" y="262" font-size="24"><tspan fill="#C4B5FD">~</tspan><tspan fill="#8A93B2">/pork </tspan><tspan fill="#38BDF8">❯</tspan><tspan fill="#8A93B2"> </tspan><tspan fill="#E6E9F5">p<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.14;0.985"/></tspan><tspan fill="#E6E9F5">o<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.145;0.985"/></tspan><tspan fill="#E6E9F5">r<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.15;0.985"/></tspan><tspan fill="#E6E9F5">k<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.155;0.985"/></tspan><tspan fill="#E6E9F5"> <animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.16;0.985"/></tspan><tspan fill="#E6E9F5">3<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.165;0.985"/></tspan><tspan fill="#E6E9F5">0<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.17;0.985"/></tspan><tspan fill="#E6E9F5">0<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.175;0.985"/></tspan><tspan fill="#E6E9F5">0<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.18;0.985"/></tspan></text>

<g class="rl4"><text x="48" y="306" font-size="22" font-weight="700" fill="url(#porkgrad)">Error: Port 3000 is busy</text></g>
<g class="rl5"><text x="48" y="340" font-size="20"><tspan fill="#8A93B2">PID  </tspan><tspan fill="#E6E9F5">18422</tspan><tspan fill="#8A93B2">   Process </tspan><tspan fill="#E6E9F5">node</tspan></text></g>
<g class="rl6"><text x="48" y="372" font-size="20"><tspan fill="#8A93B2">User </tspan><tspan fill="#E6E9F5">rober</tspan><tspan fill="#8A93B2">   Command </tspan><tspan fill="#E6E9F5">npm run dev</tspan></text></g>
<g class="rl7"><text x="48" y="404" font-size="20"><tspan fill="#8A93B2">Address </tspan><tspan fill="#E6E9F5">127.0.0.1:3000</tspan><tspan fill="#8A93B2">   Protocol </tspan><tspan fill="#E6E9F5">TCP</tspan><tspan fill="#8A93B2">   Status </tspan><tspan fill="#E6E9F5">LISTEN</tspan></text></g>

<text x="48" y="452" font-size="24"><tspan fill="#C4B5FD">~</tspan><tspan fill="#8A93B2">/pork </tspan><tspan fill="#38BDF8">❯</tspan><tspan fill="#8A93B2"> </tspan><tspan fill="#E6E9F5">p<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.34;0.985"/></tspan><tspan fill="#E6E9F5">o<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.345;0.985"/></tspan><tspan fill="#E6E9F5">r<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.35;0.985"/></tspan><tspan fill="#E6E9F5">k<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.355;0.985"/></tspan><tspan fill="#E6E9F5"> <animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.36;0.985"/></tspan><tspan fill="#E6E9F5">r<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.365;0.985"/></tspan><tspan fill="#E6E9F5">a<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.37;0.985"/></tspan><tspan fill="#E6E9F5">n<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.375;0.985"/></tspan><tspan fill="#E6E9F5">g<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.38;0.985"/></tspan><tspan fill="#E6E9F5">e<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.385;0.985"/></tspan><tspan fill="#E6E9F5"> <animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.39;0.985"/></tspan><tspan fill="#E6E9F5">3<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.395;0.985"/></tspan><tspan fill="#E6E9F5">0<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.40;0.985"/></tspan><tspan fill="#E6E9F5">0<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.405;0.985"/></tspan><tspan fill="#E6E9F5">0<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.41;0.985"/></tspan><tspan fill="#E6E9F5"> <animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.415;0.985"/></tspan><tspan fill="#E6E9F5">3<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.42;0.985"/></tspan><tspan fill="#E6E9F5">0<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.425;0.985"/></tspan><tspan fill="#E6E9F5">1<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.43;0.985"/></tspan><tspan fill="#E6E9F5">0<animate attributeName="opacity" repeatCount="indefinite" dur="26s" calcMode="discrete" values="0;1;0" keyTimes="0;0.435;0.985"/></tspan></text>

